<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boyne Labs</title>
<meta name="description" content="Boyne Labs. The right technology track.">
<link rel="icon" type="image/png" href="Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00BF63;
    --charcoal: #2D2D2D;
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.45);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--charcoal);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .lockup {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise 0.9s ease both;
  }

  .logo {
    display: block;
    width: clamp(260px, 60vw, 640px);
    height: auto;
  }

  .contact {
    margin-top: clamp(36px, 6vw, 64px);
    color: var(--text);
    text-decoration: none;
    font-size: clamp(15px, 2.2vw, 18px);
    font-weight: 700;
    padding-bottom: 3px;
    border-bottom: 1.5px solid rgba(255,255,255,0.18);
    transition: color 0.2s, border-color 0.2s;
  }
  .contact:hover { color: var(--green); border-color: var(--green); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lockup { animation: none; }
  }
</style>
</head>
<body>

<main class="lockup">
  <h1 style="margin:0;line-height:0"><img class="logo" src="Boyne_Labs_Dark_Logo_w_tagline.png" alt="Boyne Labs. The right technology track."></h1>
  <a class="contact" href="mailto:hello@boynelabs.com">hello@boynelabs.com</a>
</main>

<script>
(function(){
  const COUNT=14,LERP=0.30,MAX_R=5.5,MIN_R=0.8,COLOR='0,191,99',HX=-200;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:visible;';
  document.body.appendChild(svg);
  const dots=Array.from({length:COUNT},(_,i)=>{
    const t=i/(COUNT-1),r=MAX_R-t*(MAX_R-MIN_R),a=1-t*0.85;
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',r);c.setAttribute('fill',`rgba(${COLOR},${a})`);
    svg.appendChild(c);return{el:c,x:HX,y:HX,r,a};
  });
  let mx=HX,my=HX,active=false;
  document.addEventListener('mousemove',e=>{
    mx=e.clientX;my=e.clientY;
    if(!active){dots.forEach(d=>{d.x=mx;d.y=my;});active=true;}
  });
  document.addEventListener('mouseleave',()=>{active=false;mx=HX;my=HX;});
  function lerp(a,b,t){return a+(b-a)*t;}
  function frame(){
    requestAnimationFrame(frame);
    dots[0].x=lerp(dots[0].x,mx,LERP*1.6);dots[0].y=lerp(dots[0].y,my,LERP*1.6);
    for(let i=1;i<COUNT;i++){dots[i].x=lerp(dots[i].x,dots[i-1].x,LERP);dots[i].y=lerp(dots[i].y,dots[i-1].y,LERP);}
    const dx=dots[0].x-dots[COUNT-1].x,dy=dots[0].y-dots[COUNT-1].y;
    const spread=Math.min(1,Math.sqrt(dx*dx+dy*dy)/60);
    dots.forEach((d,i)=>{
      const t=i/(COUNT-1),vr=d.r*(i===0?1:spread*(1-t*0.5)+0.05);
      d.el.setAttribute('cx',d.x);d.el.setAttribute('cy',d.y);d.el.setAttribute('r',Math.max(0,vr));
    });
  }
  frame();
})();
</script>

</body>
</html>
